<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facturación Escuelas – CDV Vaccarezza</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #2dbe82;
    --green-dark: #1a8a5a;
    --green-light: #e8faf3;
    --gold: #f5a623;
    --red: #e05555;
    --gray-bg: #f5f5f3;
    --gray-mid: #e0deda;
    --gray-text: #666;
    --dark: #1a1a1a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Barlow', sans-serif; background: #f0f0ee; color: var(--dark); min-height: 100vh; font-size: 15px; }

  /* ── PIN SCREEN ── */
  .pin-screen { position: fixed; inset: 0; background: #101a14; display: flex; align-items: center; justify-content: center; z-index: 500; padding: 20px; }
  .pin-box { background: #fff; border-radius: 16px; padding: 32px 28px; max-width: 320px; width: 100%; text-align: center; }
  .pin-logo { width: 100px; height: auto; margin: 0 auto 16px; display: block; }
  .pin-title { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; color: var(--dark); margin-bottom: 4px; }
  .pin-sub { font-size: 13px; color: var(--gray-text); margin-bottom: 18px; }
  .pin-input { width: 100%; padding: 12px; font-size: 22px; letter-spacing: 6px; text-align: center; border: 2px solid var(--gray-mid); border-radius: 10px; outline: none; margin-bottom: 12px; font-family: 'Barlow', sans-serif; }
  .pin-input:focus { border-color: var(--green); }
  .pin-btn { width: 100%; padding: 12px; background: var(--green); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'Barlow', sans-serif; }
  .pin-btn:hover { background: var(--green-dark); }
  .pin-error { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 16px; font-weight: 600; }

  /* ── HEADER / LAYOUT ── */
  .header { background: #fff; border-bottom: 2px solid var(--green); padding: 12px 20px; position: sticky; top: 0; z-index: 100; }
  .header-logo { height: 44px; width: auto; display: block; }
  .main { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
  .page-title { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; margin-bottom: 16px; }

  /* ── MONTH TABS ── */
  .month-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .month-tab { flex: 1; padding: 10px; text-align: center; background: #fff; border: 2px solid var(--gray-mid); border-radius: 10px; font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 600; color: var(--gray-text); cursor: pointer; text-transform: capitalize; }
  .month-tab.active { border-color: var(--green); color: var(--green-dark); background: var(--green-light); }

  /* ── TOTALS BANNER ── */
  .totals-banner { background: var(--dark); color: #fff; border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
  .totals-label { font-size: 13px; color: #bbb; }
  .totals-amount { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; color: var(--gold); }

  /* ── SCHOOL CARD ── */
  .school-card { background: #fff; border: 1px solid var(--gray-mid); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
  .school-head { padding: 14px 16px; background: var(--gray-bg); border-bottom: 1px solid var(--gray-mid); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .school-name { font-family: 'Barlow Condensed', sans-serif; font-size: 19px; font-weight: 700; }
  .school-encargado { font-size: 12px; color: var(--gray-text); }
  .school-actions { display: flex; gap: 8px; align-items: center; }
  .icon-btn { background: none; border: none; cursor: pointer; font-size: 15px; padding: 4px 6px; color: var(--gray-text); }
  .icon-btn:hover { color: var(--dark); }
  .school-total { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; color: var(--green-dark); }
  .school-body { padding: 4px 16px 14px; }

  .date-row { padding: 10px 0; border-bottom: 1px solid #f0f0ee; }

  .week-group { border-bottom: 2px solid var(--gray-mid); padding-bottom: 10px; margin-bottom: 10px; }
  .week-group:last-child { border-bottom: none; margin-bottom: 0; }
  .week-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
  .week-head span:first-child { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; color: var(--gray-text); text-transform: uppercase; letter-spacing: 0.03em; }
  .week-total { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; color: var(--green-dark); }
  .ciclo-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; background: var(--am-bg, #eef6ff); color: var(--am-color, #2563eb); text-transform: uppercase; letter-spacing: 0.03em; margin-left: 6px; }
  .date-row:last-child { border-bottom: none; }
  .date-row.excluded > .date-row-top, .date-row.excluded > .date-row-links { opacity: 0.45; }
  .date-row-top { display: flex; align-items: center; gap: 10px; }
  .date-row-top input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--green); flex-shrink: 0; cursor: pointer; }
  .date-info { flex: 1; min-width: 0; }
  .date-label { font-size: 14px; font-weight: 600; text-transform: capitalize; }
  .date-blocks { font-size: 12.5px; color: var(--gray-text); }
  .date-subtotal { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .date-row-links { display: flex; gap: 12px; margin-top: 4px; margin-left: 28px; }
  .date-link { font-size: 12px; color: var(--green-dark); background: none; border: none; cursor: pointer; font-weight: 600; padding: 0; text-decoration: underline; font-family: 'Barlow', sans-serif; }
  .date-link.del { color: var(--red); }
  .badge-mini { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-left: 6px; background: #fff3cd; color: #856404; text-transform: none; }

  .motivo-row { margin: 4px 0 2px 28px; font-size: 12.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .motivo-prompt { color: #9a5b00; font-weight: 600; }
  .motivo-tag { background: #fde8e8; color: #a33; font-weight: 700; padding: 2px 8px; border-radius: 4px; }

  /* ── RESUMEN MENSUAL (caja con calendario) ── */
  .resumen-mensual-box { background: var(--green-light); border: 1px solid var(--green); border-radius: 10px; padding: 12px 14px; margin: 6px 0 14px; }
  .resumen-mensual-title { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--green-dark); margin-bottom: 8px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 10px; }
  .cal-dow { font-size: 10px; font-weight: 700; text-align: center; color: var(--gray-text); padding-bottom: 2px; }
  .cal-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 11px; border-radius: 6px; background: #fff; color: var(--gray-text); }
  .cal-cell.cal-on { background: var(--green); color: #fff; font-weight: 700; }
  .cal-cell.cal-blank { background: transparent; }
  .resumen-mensual-patron { font-size: 13px; line-height: 1.5; margin-bottom: 6px; }
  .resumen-mensual-motivos { font-size: 12px; color: var(--gray-text); font-style: italic; margin-bottom: 6px; }
  .resumen-mensual-total { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; color: var(--green-dark); text-align: right; }
  .share-img-btn { width: 100%; margin: 2px 0 14px; }

  .week-group-box { background: var(--green-light); border: 1px solid var(--green); border-radius: 10px; padding: 12px 14px; margin: 4px 0 10px; }
  .cal-grid-week { margin-bottom: 8px; }

  .empty-msg { color: var(--gray-text); font-size: 13px; padding: 14px 0; text-align: center; }

  /* ── EDIT PANEL (inline) ── */
  .edit-panel { background: var(--gray-bg); border-radius: 10px; padding: 12px; margin-top: 8px; }
  .edit-block-row { display: grid; grid-template-columns: 1fr 1fr 1fr 90px auto; gap: 6px; margin-bottom: 8px; align-items: center; }
  .form-bloque-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 90px auto; gap: 6px; margin-bottom: 8px; align-items: center; }
  .edit-block-row select, .edit-block-row input, .form-bloque-row select, .form-bloque-row input { padding: 7px 8px; border: 1px solid var(--gray-mid); border-radius: 6px; font-size: 13px; font-family: 'Barlow', sans-serif; width: 100%; min-width: 0; }
  .edit-block-remove { background: none; border: none; color: var(--red); font-size: 16px; cursor: pointer; }
  .edit-panel-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .btn-small { padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: 'Barlow', sans-serif; }
  .btn-small.primary { background: var(--green); color: #fff; }
  .btn-small.primary:hover { background: var(--green-dark); }
  .btn-small.ghost { background: #fff; border: 1px solid var(--gray-mid); color: var(--dark); }
  .btn-small.link { background: none; color: var(--gray-text); text-decoration: underline; }
  .edit-error { color: var(--red); font-size: 12px; margin-top: 4px; }
  .add-block-link { font-size: 13px; color: var(--green-dark); background: none; border: none; cursor: pointer; font-weight: 600; text-decoration: underline; font-family: 'Barlow', sans-serif; }

  .add-extra-wrap { margin-top: 10px; }

  /* ── ADD ESCUELA BUTTON ── */
  .add-escuela-btn { width: 100%; padding: 14px; background: #fff; border: 2px dashed var(--gray-mid); border-radius: 12px; font-size: 15px; font-weight: 600; color: var(--gray-text); cursor: pointer; font-family: 'Barlow', sans-serif; }
  .add-escuela-btn:hover { border-color: var(--green); color: var(--green-dark); }

  .toggle-activa { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; cursor: pointer; border: none; font-family: 'Barlow', sans-serif; }
  .toggle-activa.on { background: var(--green-light); color: var(--green-dark); }
  .toggle-activa.off { background: #f0f0ee; color: var(--gray-text); }

  /* ── MODAL ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 30px 14px; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: #fff; border-radius: 14px; padding: 22px; max-width: 480px; width: 100%; }
  .modal-title { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-text); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  .field input[type=text], .field input[type=number] { width: 100%; padding: 9px 10px; border: 1px solid var(--gray-mid); border-radius: 8px; font-size: 14px; font-family: 'Barlow', sans-serif; }
  .field-check { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  .field-check input { width: 17px; height: 17px; accent-color: var(--green); }
  .bloques-editor-title { font-size: 12px; font-weight: 600; color: var(--gray-text); text-transform: uppercase; letter-spacing: 0.04em; margin: 16px 0 8px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .modal-error { color: var(--red); font-size: 13px; margin-top: 8px; }
  .modal-delete { margin-top: 14px; text-align: center; }
  .modal-delete button { background: none; border: none; color: var(--red); font-size: 13px; cursor: pointer; text-decoration: underline; font-family: 'Barlow', sans-serif; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--dark); color: #fff; padding: 10px 18px; border-radius: 30px; font-size: 13px; font-weight: 600; z-index: 999; box-shadow: 0 4px 16px rgba(0,0,0,0.3); max-width: 90vw; text-align: center; }
  .toast.error { background: #b91c1c; }

  .historial-version-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--gray-mid); font-size: 12.5px; }
  .historial-version-row:last-child { border-bottom: none; }
  .historial-version-info { line-height: 1.4; }
  .historial-version-fecha { font-weight: 700; color: var(--gray-text); display: block; }
  .historial-version-resumen { color: var(--gray-text); }
  .historial-version-del { background: none; border: none; color: var(--red); font-size: 15px; cursor: pointer; padding: 2px 4px; flex-shrink: 0; }
  .historial-version-row.historial-version-activa { background: var(--green-light); border-radius: 6px; padding-left: 6px; padding-right: 6px; margin: 0 -6px; }
  .historial-version-badge { display: inline-block; background: var(--green); color: #fff; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; padding: 2px 6px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }

  @media (max-width: 480px) {
    .edit-block-row { grid-template-columns: 1fr 1fr; }
    .edit-block-row input[type=number] { grid-column: span 1; }
    .edit-block-remove { grid-column: 2; justify-self: end; }
    .form-bloque-row { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<div class="pin-screen" id="pin-screen">
  <div class="pin-box">
    <img src="Logo.png" alt="CDV Vaccarezza" class="pin-logo">
    <div class="pin-title">Facturación Escuelas</div>
    <div class="pin-sub">Ingresa el PIN para continuar</div>
    <input class="pin-input" id="pin-input" type="password" inputmode="numeric" maxlength="8" placeholder="••••" onkeydown="if(event.key==='Enter')checkPin()">
    <button class="pin-btn" onclick="checkPin()">Ingresar</button>
    <div class="pin-error" id="pin-error"></div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="header">
    <img src="Logo_horizontal.png" alt="CDV Vaccarezza" class="header-logo">
  </div>
  <div class="main">
    <div class="page-title">Facturación mensual de escuelas</div>
    <div class="month-tabs" id="month-tabs"></div>
    <div class="totals-banner" id="totals-banner"></div>
    <div id="schools-list"></div>
    <button class="add-escuela-btn" onclick="abrirModalEscuela(null)">+ Agregar escuela</button>
  </div>
</div>

<div class="modal-overlay" id="modal-escuela" onclick="if(event.target===this)cerrarModalEscuela()">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">Agregar escuela</div>
    <div id="modal-form-fields">
      <div class="field">
        <label>Nombre de la escuela</label>
        <input type="text" id="f-nombre">
      </div>
      <div class="field">
        <label>Encargado</label>
        <input type="text" id="f-encargado">
      </div>
      <div class="field field-check">
        <input type="checkbox" id="f-activa" checked>
        <label style="margin:0;text-transform:none;font-size:14px">Escuela activa (aparece en el cálculo del mes)</label>
      </div>
      <div class="field">
        <label>Ciclo de facturación</label>
        <select id="f-ciclo" style="width:100%;padding:9px 10px;border:1px solid var(--gray-mid);border-radius:8px;font-size:14px;font-family:'Barlow',sans-serif">
          <option value="mensual">Mensual</option>
          <option value="semanal">Semanal (lunes a domingo)</option>
        </select>
      </div>
      <div class="bloques-editor-title">Horario habitual</div>
      <div id="f-bloques"></div>
      <button class="add-block-link" onclick="addFormBloque()">+ Agregar bloque de horario</button>
      <div id="historial-versiones-wrap" style="display:none">
        <div class="bloques-editor-title" style="margin-top:14px">Historial de cambios de horario</div>
        <div id="historial-versiones"></div>
      </div>
      <div class="modal-error" id="modal-error"></div>
      <div class="modal-actions">
        <button class="btn-small primary" onclick="guardarEscuela()">Guardar</button>
        <button class="btn-small ghost" onclick="cerrarModalEscuela()">Cancelar</button>
      </div>
      <div class="modal-delete" id="modal-delete-wrap" style="display:none">
        <button onclick="eliminarEscuela()">Eliminar esta escuela</button>
      </div>
    </div>
    <div id="modal-vigencia-step" style="display:none">
      <div class="field">
        <label>¿Desde cuándo rige este nuevo horario?</label>
        <input type="date" id="modal-vigencia-fecha">
      </div>
      <div style="font-size:12.5px;color:var(--gray-text);margin-bottom:12px;line-height:1.5">
        Las fechas de este mes anteriores a esa fecha se siguen calculando con el horario que tenía antes.
      </div>
      <div class="modal-error" id="modal-vigencia-error"></div>
      <div class="modal-actions">
        <button class="btn-small primary" onclick="confirmarVigencia()">Confirmar</button>
        <button class="btn-small ghost" onclick="cancelarVigencia()">Volver</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
// ── CONFIGURACIÓN ─────────────────────────────────────────────
const DB_BASE = 'https://cdv-vaccarezza-default-rtdb.firebaseio.com';
const PIN = '3011';
const DIAS  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MOTIVO_LABELS = { lluvia: 'Lluvia', profesor: 'Motivo del profesor' };

// ── ESTADO ────────────────────────────────────────────────────
let state = {
  schools: {},           // id -> {nombre, encargado, activa, bloques:[...]}
  fact: {},              // monthKey -> schoolId -> {excluidas:{fecha: true|'lluvia'|'profesor'}, ediciones:{}, extras:{}}
  months: [],            // [currentKey, prevKey]
  activeMonth: null,
  editing: null,         // {schoolId, date, blocks, isExtra}
  formBloques: [],       // bloques being edited in the escuela modal
  editingSchoolId: null, // null = adding new
  pendingSave: null,     // {nombre,encargado,activa,ciclo} en espera de la fecha de vigencia
  loadError: null        // mensaje de error si falló la carga desde Firebase
};

// ── UTILIDADES ────────────────────────────────────────────────
function $(id) { return document.getElementById(id); }
function pad(n) { return String(n).padStart(2, '0'); }
function formatCLP(n) { return '$' + Math.round(n).toLocaleString('es-CL'); }

function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function monthKeyOf(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }

function shiftMonth(d, delta) {
  return new Date(d.getFullYear(), d.getMonth() + delta, 1);
}

function monthLabel(monthKey) {
  const [y, m] = monthKey.split('-').map(Number);
  return `${MESES[m-1]} ${y}`;
}

function daysInMonth(monthKey) {
  const [y, m] = monthKey.split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  const out = [];
  for (let day = 1; day <= last; day++) out.push(new Date(y, m-1, day));
  return out;
}

function parseTimeDecimal(t) {
  const [h, m] = t.split(':').map(Number);
  return h + (m||0)/60;
}

// Suma `horas` a un horario "HH:MM", sin pasar de las 23:59 (bloques de un solo día)
function sumarHora(horaStr, horas) {
  const totalMin = Math.min(Math.round(parseTimeDecimal(horaStr) * 60) + Math.round(horas * 60), 23*60 + 59);
  return `${pad(Math.floor(totalMin/60))}:${pad(totalMin%60)}`;
}

function blockSubtotal(b) {
  const horas = parseTimeDecimal(b.horaFin) - parseTimeDecimal(b.horaInicio);
  return Math.max(0, horas) * Number(b.tarifaHora || 0);
}

function blocksTotal(blocks) {
  return (blocks||[]).reduce((sum, b) => sum + blockSubtotal(b), 0);
}

function blocksSummaryText(blocks) {
  return (blocks||[]).map(b => `${b.cancha} ${b.horaInicio}–${b.horaFin}`).join(' + ');
}

function dateLabel(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return `${DIAS[d.getDay()]} ${d.getDate()}`;
}

function weekStartOf(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const mondayOffset = (d.getDay() + 6) % 7; // lunes=0 ... domingo=6
  d.setDate(d.getDate() - mondayOffset);
  return dateKey(d);
}

function weekRangeLabel(weekStartStr) {
  const start = new Date(weekStartStr + 'T00:00:00');
  const end = new Date(start); end.setDate(start.getDate() + 6);
  if (start.getMonth() === end.getMonth()) {
    return `Semana del ${start.getDate()} al ${end.getDate()} de ${MESES[end.getMonth()]}`;
  }
  return `Semana del ${start.getDate()} de ${MESES[start.getMonth()]} al ${end.getDate()} de ${MESES[end.getMonth()]}`;
}

function groupRowsByWeek(rows) {
  const groups = {};
  rows.forEach(r => {
    const wk = weekStartOf(r.date);
    (groups[wk] || (groups[wk] = [])).push(r);
  });
  return Object.keys(groups).sort().map(wk => ({ weekStart: wk, rows: groups[wk] }));
}

// Normaliza fact.excluidas a un mapa {fecha: true|'lluvia'|'profesor'}.
// Compatible con el formato antiguo (array de fechas sin motivo).
function excluidasMap(fact) {
  const e = fact.excluidas;
  if (!e) return {};
  if (Array.isArray(e)) {
    const map = {};
    e.forEach(ds => { map[ds] = true; });
    return map;
  }
  return e;
}

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) {
    const body = await res.text().catch(()=> '');
    throw new Error(`HTTP ${res.status} ${res.statusText}${body ? ' — ' + body : ''}`);
  }
  return res.json();
}

// Igual que fetch(), pero revisa que la respuesta haya sido exitosa — si
// Firebase devuelve un error (o la conexión se cae) esto lanza una excepción
// en vez de dejar que el código siga como si se hubiera guardado bien.
async function writeFetch(url, options) {
  let res;
  try {
    res = await fetch(url, options);
  } catch (e) {
    throw new Error('Sin conexión a internet.');
  }
  if (!res.ok) {
    const body = await res.text().catch(()=> '');
    throw new Error(`HTTP ${res.status} ${res.statusText}${body ? ' — ' + body : ''}`);
  }
  return res;
}

// ── CONSTRUCCIÓN DE FILAS POR ESCUELA/MES ─────────────────────

// Devuelve el historial de horarios de una escuela como lista ordenada
// de versiones {vigenteDesde, bloques}. Compatible con escuelas antiguas
// que todavía solo tienen `bloques` plano (sin historial).
function getHorarios(school) {
  if (school.horarios && school.horarios.length) {
    return [...school.horarios].sort((a,b) => a.vigenteDesde.localeCompare(b.vigenteDesde));
  }
  return [{ vigenteDesde: '2000-01-01', bloques: school.bloques || [] }];
}

// Bloques vigentes de una escuela para una fecha específica
function resolveBloques(school, dateStr) {
  const horarios = getHorarios(school);
  let applicable = horarios[0];
  for (const h of horarios) {
    if (h.vigenteDesde <= dateStr) applicable = h; else break;
  }
  return applicable ? applicable.bloques : [];
}

function rowsForSchool(schoolId, monthKey) {
  const school = state.schools[schoolId];
  const fact = (state.fact[monthKey] && state.fact[monthKey][schoolId]) || {};
  const excluidas = excluidasMap(fact);
  const ediciones = fact.ediciones || {};
  const extras = fact.extras || {};

  const rows = [];
  daysInMonth(monthKey).forEach(d => {
    const ds = dateKey(d);
    const dow = d.getDay();
    const vigentes = resolveBloques(school, ds).filter(b => b.dia === dow);
    if (vigentes.length) {
      const excluded = ds in excluidas;
      const motivoVal = excluidas[ds];
      const motivo = (motivoVal && motivoVal !== true) ? motivoVal : null;
      const edited = ediciones[ds];
      rows.push({ date: ds, blocks: edited || vigentes, excluded, motivo, isEdited: !!edited, isExtra: false });
    }
  });
  Object.keys(extras).forEach(ds => {
    if (ds.slice(0,7) === monthKey) {
      rows.push({ date: ds, blocks: extras[ds], excluded: false, isEdited: false, isExtra: true });
    }
  });
  rows.sort((a,b) => a.date.localeCompare(b.date));
  return rows;
}

function schoolTotal(schoolId, monthKey) {
  return rowsForSchool(schoolId, monthKey)
    .filter(r => !r.excluded)
    .reduce((sum, r) => sum + blocksTotal(r.blocks), 0);
}

// ── RESUMEN MENSUAL (caja con calendario, para escuelas mensuales) ─

// Horario habitual de la escuela para ese mes: combinaciones únicas
// {día, cancha, horaInicio, horaFin} tomadas de las fechas "normales" del
// mes (sin contar fechas excluidas, puntuales, ni editadas individualmente),
// fusionando bloques consecutivos del mismo día y cancha en un solo rango.
function horarioHabitualTexto(schoolId, monthKey) {
  const school = state.schools[schoolId];
  const rows = rowsForSchool(schoolId, monthKey);
  const seen = new Set();
  const buckets = {}; // "dow|cancha" -> [{horaInicio,horaFin}]
  rows.forEach(r => {
    if (r.isExtra || r.excluded) return;
    if (r.isEdited) {
      // Una fecha "editada" solo deja de contar como patrón habitual si su
      // contenido realmente difiere del horario base vigente para esa fecha.
      // Si coincide exactamente (por ejemplo, quedó una edición puntual de
      // cuando el horario base todavía no tenía ese día, y ya se actualizó),
      // sí cuenta como habitual — así no hace falta "Restablecer" cada fecha
      // a mano para que el resumen quede correcto.
      const dowEdit = new Date(r.date + 'T00:00:00').getDay();
      const vigentes = resolveBloques(school, r.date).filter(b => b.dia === dowEdit);
      const coincideConBase = vigentes.length && JSON.stringify(normalizarBloques(r.blocks)) === JSON.stringify(normalizarBloques(vigentes));
      if (!coincideConBase) return;
    }
    const dow = new Date(r.date + 'T00:00:00').getDay();
    (r.blocks || []).forEach(b => {
      const key = `${dow}|${b.cancha}|${b.horaInicio}|${b.horaFin}`;
      if (seen.has(key)) return;
      seen.add(key);
      const bk = `${dow}|${b.cancha}`;
      (buckets[bk] || (buckets[bk] = [])).push({ horaInicio: b.horaInicio, horaFin: b.horaFin });
    });
  });

  const merged = [];
  Object.keys(buckets).forEach(bk => {
    const [dowStr, cancha] = bk.split('|');
    const dow = Number(dowStr);
    const tramos = buckets[bk].slice().sort((a,b) => a.horaInicio.localeCompare(b.horaInicio));
    tramos.forEach(t => {
      const last = merged[merged.length - 1];
      if (last && last.dow === dow && last.cancha === cancha && last.horaFin === t.horaInicio) {
        last.horaFin = t.horaFin;
      } else {
        merged.push({ dow, cancha, horaInicio: t.horaInicio, horaFin: t.horaFin });
      }
    });
  });

  if (!merged.length) return 'Sin horario habitual registrado este mes.';
  merged.sort((a,b) => a.dow - b.dow || a.horaInicio.localeCompare(b.horaInicio));
  return merged.map(c => `${DIAS[c.dow].toLowerCase()} ${c.horaInicio}-${c.horaFin} ${c.cancha.replace('Cancha ','C')}`).join('; ');
}

// Días del mes (número de día) en que efectivamente hay clase (ya
// descontando fechas excluidas y sumando fechas puntuales).
function diasConClase(schoolId, monthKey) {
  const rows = rowsForSchool(schoolId, monthKey).filter(r => !r.excluded);
  return new Set(rows.map(r => Number(r.date.slice(8,10))));
}

// Líneas "día: suspendido por <motivo>" para las fechas excluidas de ese
// mes que tengan un motivo registrado.
function motivosDelMes(schoolId, monthKey) {
  const fact = (state.fact[monthKey] && state.fact[monthKey][schoolId]) || {};
  const map = excluidasMap(fact);
  const out = [];
  Object.keys(map).sort().forEach(ds => {
    if (ds.slice(0,7) !== monthKey) return;
    const val = map[ds];
    if (val && val !== true) {
      const dow = new Date(ds + 'T00:00:00').getDay();
      out.push(`${DIAS[dow].toLowerCase()} ${Number(ds.slice(8,10))}: suspendido por ${(MOTIVO_LABELS[val] || val).toLowerCase()}`);
    }
  });
  return out;
}

function renderMiniCalendario(monthKey, diasSet) {
  const [y, m] = monthKey.split('-').map(Number);
  const firstDow = new Date(y, m-1, 1).getDay(); // 0=domingo
  const totalDias = new Date(y, m, 0).getDate();
  const leadBlank = (firstDow + 6) % 7; // grilla de lunes a domingo
  let cells = '';
  for (let i = 0; i < leadBlank; i++) cells += `<div class="cal-cell cal-blank"></div>`;
  for (let d = 1; d <= totalDias; d++) {
    cells += `<div class="cal-cell ${diasSet.has(d) ? 'cal-on' : ''}">${d}</div>`;
  }
  return `<div class="cal-grid">
    <div class="cal-dow">L</div><div class="cal-dow">M</div><div class="cal-dow">M</div><div class="cal-dow">J</div><div class="cal-dow">V</div><div class="cal-dow">S</div><div class="cal-dow">D</div>
    ${cells}
  </div>`;
}

function renderResumenMensual(schoolId, monthKey) {
  const total = schoolTotal(schoolId, monthKey);
  const diasSet = diasConClase(schoolId, monthKey);
  const motivos = motivosDelMes(schoolId, monthKey);
  const boxId = `resumen-mensual-${schoolId}`;
  const nombreArchivo = archivoSeguro(`resumen-${state.schools[schoolId].nombre}-${monthKey}`);
  return `
  <div class="resumen-mensual-box" id="${boxId}">
    <div class="resumen-mensual-title">Resumen ${monthLabel(monthKey)}</div>
    ${renderMiniCalendario(monthKey, diasSet)}
    <div class="resumen-mensual-patron">${horarioHabitualTexto(schoolId, monthKey)}</div>
    ${motivos.length ? `<div class="resumen-mensual-motivos">${motivos.join('<br>')}</div>` : ''}
    <div class="resumen-mensual-total">Total a pagar: ${formatCLP(total)}</div>
  </div>
  <button class="btn-small ghost share-img-btn" onclick="compartirComoImagen('${boxId}','${nombreArchivo}.png','Resumen ${monthLabel(monthKey)}')">📤 Compartir como imagen</button>`;
}

// Calendario de una sola semana (lunes a domingo) para escuelas semanales.
function renderMiniCalendarioSemana(weekStart, rows) {
  const diasSet = new Set(rows.filter(r => !r.excluded).map(r => (new Date(r.date + 'T00:00:00').getDay() + 6) % 7));
  let cells = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart + 'T00:00:00'); d.setDate(d.getDate() + i);
    cells += `<div class="cal-cell ${diasSet.has(i) ? 'cal-on' : ''}">${d.getDate()}</div>`;
  }
  return `<div class="cal-grid cal-grid-week">
    <div class="cal-dow">L</div><div class="cal-dow">M</div><div class="cal-dow">M</div><div class="cal-dow">J</div><div class="cal-dow">V</div><div class="cal-dow">S</div><div class="cal-dow">D</div>
    ${cells}
  </div>`;
}

// Texto condensado "día horario cancha" para el resumen de una semana
// (escuelas semanales): a diferencia del mensual no hay un "patrón habitual"
// que abstraer (una semana no se repite), así que se listan directamente
// todas las fechas no excluidas de esa semana, fusionando bloques
// consecutivos del mismo día y cancha.
function horarioSemanaTexto(rows) {
  const activos = rows.filter(r => !r.excluded);
  if (!activos.length) return 'Sin clases programadas esta semana.';
  const items = [];
  activos.forEach(r => {
    const dow = new Date(r.date + 'T00:00:00').getDay();
    (r.blocks || []).forEach(b => items.push({ dow, cancha: b.cancha, horaInicio: b.horaInicio, horaFin: b.horaFin }));
  });
  items.sort((a,b) => a.dow - b.dow || a.horaInicio.localeCompare(b.horaInicio));
  const merged = [];
  items.forEach(it => {
    const last = merged[merged.length - 1];
    if (last && last.dow === it.dow && last.cancha === it.cancha && last.horaFin === it.horaInicio) {
      last.horaFin = it.horaFin;
    } else {
      merged.push({ ...it });
    }
  });
  return merged.map(c => `${DIAS[c.dow].toLowerCase()} ${c.horaInicio}-${c.horaFin} ${c.cancha.replace('Cancha ','C')}`).join('; ');
}

// Líneas "día: suspendido por <motivo>" para las fechas excluidas con motivo
// dentro de una semana.
function motivosDeSemana(rows) {
  const out = [];
  rows.forEach(r => {
    if (r.motivo) {
      const dow = new Date(r.date + 'T00:00:00').getDay();
      out.push(`${DIAS[dow].toLowerCase()} ${Number(r.date.slice(8,10))}: suspendido por ${(MOTIVO_LABELS[r.motivo] || r.motivo).toLowerCase()}`);
    }
  });
  return out;
}

// Caja resumen de una semana (escuelas semanales), con el mismo estilo de
// tarjeta verde que el resumen mensual: título, mini calendario, texto
// condensado de la semana, motivos y total — sin las fechas con checkbox
// (esas se muestran aparte, fuera de esta caja, para no salir en la imagen
// compartida).
function renderResumenSemanal(schoolId, weekStart, rows) {
  const total = rows.filter(r => !r.excluded).reduce((s,r) => s + blocksTotal(r.blocks), 0);
  const motivos = motivosDeSemana(rows);
  const boxId = `week-box-${schoolId}-${weekStart}`;
  const nombreArchivo = archivoSeguro(`semana-${state.schools[schoolId].nombre}-${weekStart}`);
  return `
  <div class="resumen-mensual-box" id="${boxId}">
    <div class="resumen-mensual-title">${weekRangeLabel(weekStart)}</div>
    ${renderMiniCalendarioSemana(weekStart, rows)}
    <div class="resumen-mensual-patron">${horarioSemanaTexto(rows)}</div>
    ${motivos.length ? `<div class="resumen-mensual-motivos">${motivos.join('<br>')}</div>` : ''}
    <div class="resumen-mensual-total">Total a pagar: ${formatCLP(total)}</div>
  </div>
  <button class="btn-small ghost share-img-btn" onclick="compartirComoImagen('${boxId}','${nombreArchivo}.png','${weekRangeLabel(weekStart)}')">📤 Compartir como imagen</button>`;
}

function archivoSeguro(txt) {
  return (txt || 'resumen').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase();
}

// Genera una imagen PNG de la caja indicada y la comparte directo (WhatsApp,
// etc.) si el navegador lo permite; si no, la descarga.
async function compartirComoImagen(elementId, fileName, titulo) {
  const el = document.getElementById(elementId);
  if (!el || typeof html2canvas === 'undefined') { showToast('No se pudo generar la imagen'); return; }
  showToast('Generando imagen…');
  try {
    const canvas = await html2canvas(el, { backgroundColor: '#ffffff', scale: 2 });
    canvas.toBlob(async (blob) => {
      if (!blob) { showToast('No se pudo generar la imagen'); return; }
      const file = new File([blob], fileName, { type: 'image/png' });
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: titulo }); return; }
        catch(e) { /* canceló o falló el share nativo: seguimos con la descarga */ }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      showToast('Imagen descargada ✓');
    }, 'image/png');
  } catch(e) {
    showToast('No se pudo generar la imagen');
  }
}

function renderSchools() {
  const wrap = $('schools-list');
  if (state.loadError) {
    wrap.innerHTML = `<div style="background:#fdecea;border:1px solid var(--red);border-radius:10px;padding:16px;color:#8a1f1f;font-size:13.5px;line-height:1.6">
      <strong>No se pudieron cargar las escuelas.</strong><br>
      Detalle técnico: ${state.loadError}<br><br>
      Esto casi siempre pasa porque las reglas de Firebase (Realtime Database → pestaña Rules) no dejan leer o escribir en la ruta <code>/escuelas</code>, aunque sí dejen en <code>/rivales</code>.
      <div style="margin-top:12px"><button class="btn-small primary" onclick="reintentarCarga()">Reintentar</button></div>
    </div>`;
    return;
  }
  const ids = Object.keys(state.schools).sort((a,b) => (state.schools[a].nombre||'').localeCompare(state.schools[b].nombre||''));
  if (ids.length === 0) { wrap.innerHTML = '<div class="empty-msg">No hay escuelas cargadas todavía.</div>'; return; }

  wrap.innerHTML = ids.map(id => {
    const school = state.schools[id];
    const rows = rowsForSchool(id, state.activeMonth);
    const total = schoolTotal(id, state.activeMonth);

    let rowsHtml;
    if (!school.activa) {
      rowsHtml = `<div class="empty-msg">Escuela inactiva — no se está calculando este mes.</div>`;
    } else if (rows.length === 0) {
      rowsHtml = `<div class="empty-msg">No hay fechas este mes para esta escuela.</div>`;
    } else if (school.ciclo === 'semanal') {
      const weeks = groupRowsByWeek(rows);
      rowsHtml = weeks.map(w => `
        <div class="week-group">
          ${renderResumenSemanal(id, w.weekStart, w.rows)}
          ${w.rows.map(r => renderDateRow(id, r)).join('')}
        </div>`).join('');
    } else {
      rowsHtml = rows.map(r => renderDateRow(id, r)).join('');
    }

    return `
    <div class="school-card">
      <div class="school-head">
        <div>
          <div class="school-name">${school.nombre}${school.ciclo==='semanal' ? '<span class="ciclo-badge">Semanal</span>' : ''}</div>
          <div class="school-encargado">${school.encargado || 'Sin encargado'}</div>
        </div>
        <div class="school-actions">
          <button class="toggle-activa ${school.activa?'on':'off'}" onclick="toggleActiva('${id}', ${!school.activa})">${school.activa?'Activa':'Inactiva'}</button>
          <button class="icon-btn" onclick="abrirModalEscuela('${id}')" title="Editar">✏️</button>
        </div>
      </div>
      <div class="school-body">
        ${school.activa && school.ciclo !== 'semanal' ? renderResumenMensual(id, state.activeMonth) : ''}
        ${rowsHtml}
        ${school.activa ? `
        <div style="display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--gray-mid)">
          <span style="font-size:12px;color:var(--gray-text)">Total</span>
          <span class="school-total">${formatCLP(total)}</span>
        </div>
        <div class="add-extra-wrap">
          ${(state.editing && state.editing.isNew && state.editing.schoolId===id) ? '<div id="new-extra-slot"></div>' : `<button class="date-link" onclick="agregarFechaExtra('${id}')">+ Agregar fecha puntual</button>`}
        </div>
        ` : ''}
      </div>
    </div>`;
  }).join('');

  // Si hay una fila en edición, inyectar su panel
  if (state.editing) renderEditPanel();
}

function renderDateRow(schoolId, r) {
  const isEditingThis = state.editing && state.editing.schoolId === schoolId && state.editing.date === r.date;
  const subtotal = r.excluded ? 0 : blocksTotal(r.blocks);
  const badge = r.isExtra ? '<span class="badge-mini">fecha puntual</span>' : (r.isEdited ? '<span class="badge-mini">editado</span>' : '');
  return `
  <div class="date-row ${r.excluded?'excluded':''}" id="row-${schoolId}-${r.date}">
    <div class="date-row-top">
      ${r.isExtra ? '<span style="width:18px"></span>' : `<input type="checkbox" ${r.excluded?'':'checked'} onchange="toggleExcluir('${schoolId}','${r.date}')">`}
      <div class="date-info">
        <div class="date-label">${dateLabel(r.date)} ${badge}</div>
        <div class="date-blocks">${blocksSummaryText(r.blocks)}</div>
      </div>
      <div class="date-subtotal">${formatCLP(subtotal)}</div>
    </div>
    ${(r.excluded && !r.isExtra) ? `
    <div class="motivo-row">
      ${r.motivo
        ? `<span class="motivo-tag">Motivo: ${MOTIVO_LABELS[r.motivo] || r.motivo}</span><button class="date-link" onclick="setMotivo('${schoolId}','${r.date}', null)">Quitar motivo</button>`
        : `<span class="motivo-prompt">¿Motivo de suspensión?</span><button class="date-link" onclick="setMotivo('${schoolId}','${r.date}','lluvia')">Lluvia</button><button class="date-link" onclick="setMotivo('${schoolId}','${r.date}','profesor')">Motivo del profesor</button>`}
    </div>` : ''}
    <div class="date-row-links">
      <button class="date-link" onclick="editarFecha('${schoolId}','${r.date}', ${r.isExtra})">✏️ Editar horario</button>
      ${r.isEdited && !r.isExtra ? `<button class="date-link" onclick="restablecerFecha('${schoolId}','${r.date}')">↺ Restablecer</button>` : ''}
      ${r.isExtra ? `<button class="date-link del" onclick="eliminarExtra('${schoolId}','${r.date}')">🗑 Eliminar</button>` : ''}
    </div>
    ${isEditingThis ? `<div id="edit-panel-slot"></div>` : ''}
  </div>`;
}

function renderEditPanel() {
  const e = state.editing;
  const slot = document.getElementById(e.isNew ? 'new-extra-slot' : 'edit-panel-slot');
  if (!slot) return;
  const [my, mm] = state.activeMonth.split('-').map(Number);
  const minDate = `${my}-${pad(mm)}-01`;
  const maxDate = dateKey(new Date(my, mm, 0));
  const dateFieldHtml = e.isNew ? `
    <div class="field" style="margin-bottom:10px">
      <label>Fecha</label>
      <input type="date" value="${e.date}" min="${minDate}" max="${maxDate}" onchange="state.editing.date=this.value">
    </div>` : '';
  const rowsHtml = e.blocks.map((b, i) => `
    <div class="edit-block-row">
      <select onchange="editBlockField(${i},'cancha',this.value)">
        <option value="Cancha 1" ${b.cancha==='Cancha 1'?'selected':''}>Cancha 1</option>
        <option value="Cancha 2" ${b.cancha==='Cancha 2'?'selected':''}>Cancha 2</option>
      </select>
      <input type="time" value="${b.horaInicio}" onchange="editBlockField(${i},'horaInicio',this.value)">
      <input type="time" value="${b.horaFin}" onchange="editBlockField(${i},'horaFin',this.value)">
      <input type="number" value="${b.tarifaHora}" placeholder="$/hr" onchange="editBlockField(${i},'tarifaHora',this.value)">
      <button class="edit-block-remove" onclick="removeEditBlock(${i})">✕</button>
    </div>`).join('');
  slot.innerHTML = `
    <div class="edit-panel">
      ${dateFieldHtml}
      ${rowsHtml || '<div class="empty-msg">Sin bloques — agrega uno.</div>'}
      <button class="add-block-link" onclick="addEditBlock()">+ Agregar bloque</button>
      <div id="edit-error" class="edit-error"></div>
      <div class="edit-panel-actions">
        <button class="btn-small primary" onclick="guardarEdicionFecha()">Guardar</button>
        <button class="btn-small ghost" onclick="cancelarEdicionFecha()">Cancelar</button>
      </div>
    </div>`;
}

// ── ACCIONES: EXCLUIR / EDITAR FECHA ───────────────────────────
async function toggleExcluir(schoolId, dateStr) {
  const fact = state.fact[state.activeMonth][schoolId] || (state.fact[state.activeMonth][schoolId] = {});
  const map = ensureExcluidasObj(fact);
  const estabaExcluida = dateStr in map;
  if (estabaExcluida) delete map[dateStr]; else map[dateStr] = true;
  render();
  try {
    await saveExcluidas(state.activeMonth, schoolId, map);
  } catch (err) {
    if (estabaExcluida) map[dateStr] = true; else delete map[dateStr];
    render();
    showErrorToast('No se pudo guardar. Revisa tu conexión e intenta de nuevo.');
  }
}

async function setMotivo(schoolId, dateStr, motivo) {
  const fact = state.fact[state.activeMonth][schoolId] || (state.fact[state.activeMonth][schoolId] = {});
  const map = ensureExcluidasObj(fact);
  if (!(dateStr in map)) return; // la fecha ya no está excluida
  const anterior = map[dateStr];
  map[dateStr] = motivo || true;
  render();
  try {
    await saveExcluidas(state.activeMonth, schoolId, map);
  } catch (err) {
    map[dateStr] = anterior;
    render();
    showErrorToast('No se pudo guardar el motivo. Revisa tu conexión e intenta de nuevo.');
  }
}

function editarFecha(schoolId, dateStr, isExtra) {
  const rows = rowsForSchool(schoolId, state.activeMonth);
  const row = rows.find(r => r.date === dateStr);
  state.editing = { schoolId, date: dateStr, isExtra, blocks: JSON.parse(JSON.stringify(row.blocks)) };
  renderSchools();
}

function cancelarEdicionFecha() { state.editing = null; renderSchools(); }

function editBlockField(i, field, value) {
  const b = state.editing.blocks[i];
  if (field === 'tarifaHora') { b.tarifaHora = Number(value); return; }
  if (field === 'horaInicio') { b.horaInicio = value; b.horaFin = sumarHora(value, 1); renderEditPanel(); return; }
  b[field] = value;
}
function addEditBlock() {
  const blocks = state.editing.blocks;
  const prev = blocks[blocks.length - 1];
  blocks.push(prev
    ? { cancha: prev.cancha, horaInicio: prev.horaFin, horaFin: sumarHora(prev.horaFin, 1), tarifaHora: prev.tarifaHora }
    : { cancha: 'Cancha 1', horaInicio: '10:00', horaFin: '11:00', tarifaHora: 16000 });
  renderEditPanel();
}
function removeEditBlock(i) {
  state.editing.blocks.splice(i, 1);
  renderEditPanel();
}

async function guardarEdicionFecha() {
  const e = state.editing;
  if (e.blocks.length === 0) { $('edit-error').textContent = 'Agrega al menos un bloque, o elimina la fecha.'; return; }
  for (const b of e.blocks) {
    if (parseTimeDecimal(b.horaFin) <= parseTimeDecimal(b.horaInicio)) {
      $('edit-error').textContent = 'La hora de fin debe ser posterior a la de inicio.'; return;
    }
  }
  if (e.isNew && e.date.slice(0,7) !== state.activeMonth) {
    $('edit-error').textContent = 'La fecha debe estar dentro del mes seleccionado.'; return;
  }
  const fact = state.fact[state.activeMonth][e.schoolId] || (state.fact[state.activeMonth][e.schoolId] = {});
  const anteriorExtra = fact.extras && fact.extras[e.date];
  const anteriorEdicion = fact.ediciones && fact.ediciones[e.date];
  if (e.isExtra) (fact.extras || (fact.extras = {}))[e.date] = e.blocks;
  else (fact.ediciones || (fact.ediciones = {}))[e.date] = e.blocks;
  render();
  try {
    if (e.isExtra) await saveExtra(state.activeMonth, e.schoolId, e.date, e.blocks);
    else await saveEdicion(state.activeMonth, e.schoolId, e.date, e.blocks);
  } catch (err) {
    if (e.isExtra) { if (anteriorExtra) fact.extras[e.date] = anteriorExtra; else delete fact.extras[e.date]; }
    else { if (anteriorEdicion) fact.ediciones[e.date] = anteriorEdicion; else delete fact.ediciones[e.date]; }
    render();
    showErrorToast('No se pudo guardar. Revisa tu conexión e intenta de nuevo.');
    return;
  }
  state.editing = null;
  render();
  showToast('Guardado ✓');
}

async function restablecerFecha(schoolId, dateStr) {
  const fact = state.fact[state.activeMonth][schoolId];
  const anterior = fact && fact.ediciones && fact.ediciones[dateStr];
  if (fact && fact.ediciones) delete fact.ediciones[dateStr];
  render();
  try {
    await deleteEdicion(state.activeMonth, schoolId, dateStr);
  } catch (err) {
    if (anterior) (fact.ediciones || (fact.ediciones = {}))[dateStr] = anterior;
    render();
    showErrorToast('No se pudo restablecer. Revisa tu conexión e intenta de nuevo.');
  }
}

async function eliminarExtra(schoolId, dateStr) {
  const fact = state.fact[state.activeMonth][schoolId];
  const anterior = fact && fact.extras && fact.extras[dateStr];
  if (fact && fact.extras) delete fact.extras[dateStr];
  if (state.editing && state.editing.schoolId===schoolId && state.editing.date===dateStr) state.editing = null;
  render();
  try {
    await deleteExtra(state.activeMonth, schoolId, dateStr);
  } catch (err) {
    if (anterior) (fact.extras || (fact.extras = {}))[dateStr] = anterior;
    render();
    showErrorToast('No se pudo eliminar. Revisa tu conexión e intenta de nuevo.');
  }
}

// Horario habitual de la escuela para usar como punto de partida al agregar
// una fecha puntual: el bloque de ese mismo día de la semana si entrena ese
// día, o si no, su primer bloque guardado.
function horarioHabitualPara(school, dateStr) {
  const bloques = resolveBloques(school, dateStr);
  if (!bloques.length) return [{ cancha: 'Cancha 1', horaInicio: '10:00', horaFin: '11:00', tarifaHora: 16000 }];
  const dow = new Date(dateStr + 'T00:00:00').getDay();
  const delDia = bloques.filter(b => b.dia === dow);
  const base = (delDia.length ? delDia : bloques)[0];
  return [{ cancha: base.cancha, horaInicio: base.horaInicio, horaFin: base.horaFin, tarifaHora: base.tarifaHora }];
}

function agregarFechaExtra(schoolId) {
  const hoy = new Date();
  const [y,m] = state.activeMonth.split('-').map(Number);
  const base = (y===hoy.getFullYear() && m===hoy.getMonth()+1) ? hoy : new Date(y, m-1, 1);
  const dateStr = dateKey(base);
  const school = state.schools[schoolId];
  state.editing = { schoolId, date: dateStr, isExtra: true, isNew: true, blocks: horarioHabitualPara(school, dateStr) };
  renderSchools();
}

async function toggleActiva(id, activa) {
  state.schools[id].activa = activa;
  render();
  try {
    await toggleEscuelaActiva(id, activa);
  } catch (err) {
    state.schools[id].activa = !activa;
    render();
    showErrorToast('No se pudo guardar. Revisa tu conexión e intenta de nuevo.');
  }
}

  $('modal-error').textContent = '';
  $('modal-form-fields').style.display = 'block';

// Lista de versiones guardadas del horario de la escuela (desde cuándo rige
// cada una), con opción de eliminar una versión mal guardada. Solo se
// muestra si hay más de una versión — si hay una sola no hay nada que
// gestionar.
function renderHistorialVersiones() {
  const wrap = $('historial-versiones-wrap');
  const id = state.editingSchoolId;
  if (!id) { wrap.style.display = 'none'; return; }
  const horarios = getHorarios(state.schools[id]);
  if (horarios.length <= 1) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  // Cuál versión es la que aplica hoy (misma lógica que resolveBloques):
  // la última cuya vigenteDesde sea hoy o anterior.
  const hoy = dateKey(new Date());
  let idxVigente = 0;
  horarios.forEach((h, i) => { if (h.vigenteDesde <= hoy) idxVigente = i; });
  $('historial-versiones').innerHTML = horarios.map((h, i) => `
    <div class="historial-version-row ${i === idxVigente ? 'historial-version-activa' : ''}">
      <div class="historial-version-info">
        <span class="historial-version-fecha">Desde ${formatFechaCorta(h.vigenteDesde)}${i === idxVigente ? '<span class="historial-version-badge">vigente hoy</span>' : ''}</span>
        <span class="historial-version-resumen">${horarioVersionTexto(h.bloques)}</span>
      </div>
      <button class="historial-version-del" onclick="eliminarVersionHistorial(${i})" title="Eliminar esta versión">🗑</button>
    </div>`).join('');
}

function formatFechaCorta(ds) {
  const [y,m,d] = ds.split('-');
  return `${d}-${m}-${y}`;
}

// Resumen corto de un conjunto de bloques (para la lista de historial):
// fusiona bloques consecutivos del mismo día y cancha, igual que
// horarioHabitualTexto, pero sobre un solo arreglo de bloques ya dado.
function horarioVersionTexto(bloques) {
  if (!bloques || !bloques.length) return 'Sin bloques';
  const merged = [];
  const sorted = [...bloques].sort((a,b) => a.dia - b.dia || a.horaInicio.localeCompare(b.horaInicio));
  sorted.forEach(b => {
    const last = merged[merged.length - 1];
    if (last && last.dia === b.dia && last.cancha === b.cancha && last.horaFin === b.horaInicio) {
      last.horaFin = b.horaFin;
    } else {
      merged.push({ dia: b.dia, cancha: b.cancha, horaInicio: b.horaInicio, horaFin: b.horaFin });
    }
  });
  return merged.map(c => `${DIAS[c.dia].toLowerCase()} ${c.horaInicio}-${c.horaFin} ${c.cancha.replace('Cancha ','C')}`).join('; ');
}

async function eliminarVersionHistorial(i) {
  const id = state.editingSchoolId;
  const horarios = getHorarios(state.schools[id]);
  if (horarios.length <= 1) return; // siempre debe quedar al menos una versión
  if (!confirm(`¿Eliminar la versión de horario vigente desde ${formatFechaCorta(horarios[i].vigenteDesde)}? Esto no se puede deshacer.`)) return;
  const anteriorData = state.schools[id];
  const nuevosHorarios = horarios.slice(0, i).concat(horarios.slice(i + 1));
  const data = { ...state.schools[id], horarios: nuevosHorarios };
  state.schools[id] = data;
  state.formBloques = JSON.parse(JSON.stringify(resolveBloques(data, dateKey(new Date()))));
  renderFormBloques();
  renderHistorialVersiones();
  render();
  try {
    await saveEscuelaConfig(id, data);
    showToast('Versión eliminada ✓');
  } catch (err) {
    state.schools[id] = anteriorData;
    state.formBloques = JSON.parse(JSON.stringify(resolveBloques(anteriorData, dateKey(new Date()))));
    renderFormBloques();
    renderHistorialVersiones();
    render();
    showErrorToast('No se pudo eliminar la versión. Revisa tu conexión e intenta de nuevo.');
  }
}

function cerrarModalEscuela() {
  $('modal-escuela').classList.remove('open');
  state.pendingSave = null;
}

function renderFormBloques() {
  $('f-bloques').innerHTML = state.formBloques.map((b, i) => `
    <div class="form-bloque-row">
      <select onchange="editFormBloque(${i},'dia',this.value)">
        ${DIAS.map((d,di) => `<option value="${di}" ${b.dia==di?'selected':''}>${d}</option>`).join('')}
      </select>
      <select onchange="editFormBloque(${i},'cancha',this.value)">
        <option value="Cancha 1" ${b.cancha==='Cancha 1'?'selected':''}>Cancha 1</option>
        <option value="Cancha 2" ${b.cancha==='Cancha 2'?'selected':''}>Cancha 2</option>
      </select>
      <input type="time" value="${b.horaInicio||'10:00'}" onchange="editFormBloque(${i},'horaInicio',this.value)">
      <input type="time" value="${b.horaFin||'11:00'}" onchange="editFormBloque(${i},'horaFin',this.value)">
      <input type="number" value="${b.tarifaHora||16000}" placeholder="$/hr" onchange="editFormBloque(${i},'tarifaHora',this.value)">
      <button class="edit-block-remove" onclick="removeFormBloque(${i})">✕</button>
    </div>`).join('');
}

function addFormBloque() {
  const blocks = state.formBloques;
  const prev = blocks[blocks.length - 1];
  blocks.push(prev
    ? { dia: prev.dia, cancha: prev.cancha, horaInicio: prev.horaFin, horaFin: sumarHora(prev.horaFin, 1), tarifaHora: prev.tarifaHora }
    : { dia: 6, cancha:'Cancha 1', horaInicio:'10:00', horaFin:'11:00', tarifaHora:16000 });
  renderFormBloques();
}
function editFormBloque(i, field, value) {
  const b = state.formBloques[i];
  if (field === 'dia' || field === 'tarifaHora') { b[field] = Number(value); return; }
  if (field === 'horaInicio') { b.horaInicio = value; b.horaFin = sumarHora(value, 1); renderFormBloques(); return; }
  b[field] = value;
}
function removeFormBloque(i) { state.formBloques.splice(i,1); renderFormBloques(); }

async function guardarEscuela() {
  const nombre = $('f-nombre').value.trim();
  const encargado = $('f-encargado').value.trim();
  const activa = $('f-activa').checked;
  const ciclo = $('f-ciclo').value;
  if (!nombre) { $('modal-error').textContent = 'El nombre es obligatorio.'; return; }
  if (state.formBloques.length === 0) { $('modal-error').textContent = 'Agrega al menos un bloque de horario.'; return; }
  for (const b of state.formBloques) {
    if (parseTimeDecimal(b.horaFin) <= parseTimeDecimal(b.horaInicio)) { $('modal-error').textContent = 'Hay un bloque con hora de fin antes que la de inicio.'; return; }
  }
  const datosBase = { nombre, encargado, activa, ciclo };

  if (!state.editingSchoolId) {
    // Escuela nueva: una sola versión de horario, vigente desde siempre.
    const data = { ...datosBase, horarios: [{ vigenteDesde: '2000-01-01', bloques: state.formBloques }] };
    const tempId = 'tmp-' + Date.now();
    state.schools[tempId] = data;
    render();
    try {
      const realId = await pushNuevaEscuela(data);
      delete state.schools[tempId];
      state.schools[realId] = data;
      cerrarModalEscuela();
      render();
      showToast('Escuela guardada ✓');
    } catch (err) {
      delete state.schools[tempId];
      render();
      $('modal-error').textContent = 'No se pudo guardar. Revisa tu conexión e intenta de nuevo.';
    }
    return;
  }

  // Escuela existente: si el horario no cambió, solo se actualizan los demás
  // datos, sin tocar el historial ni preguntar vigencia.
  const existentes = getHorarios(state.schools[state.editingSchoolId]);
  const bloquesActuales = existentes.length ? existentes[existentes.length - 1].bloques : [];
  const cambioHorario = JSON.stringify(bloquesActuales) !== JSON.stringify(state.formBloques);

  if (!cambioHorario) {
    const anteriorData = state.schools[state.editingSchoolId];
    const data = { ...anteriorData, ...datosBase };
    state.schools[state.editingSchoolId] = data;
    try {
      await saveEscuelaConfig(state.editingSchoolId, data);
      cerrarModalEscuela();
      render();
      showToast('Escuela guardada ✓');
    } catch (err) {
      state.schools[state.editingSchoolId] = anteriorData;
      $('modal-error').textContent = 'No se pudo guardar. Revisa tu conexión e intenta de nuevo.';
    }
    return;
  }

  // El horario sí cambió: preguntar desde cuándo rige antes de guardar.
  state.pendingSave = datosBase;
  $('modal-vigencia-fecha').value = dateKey(new Date());
  $('modal-vigencia-error').textContent = '';
  $('modal-form-fields').style.display = 'none';
  $('modal-vigencia-step').style.display = 'block';
}

function cancelarVigencia() {
  state.pendingSave = null;
  $('modal-vigencia-step').style.display = 'none';
  $('modal-form-fields').style.display = 'block';
}

async function confirmarVigencia() {
  const fecha = $('modal-vigencia-fecha').value;
  if (!fecha) { $('modal-vigencia-error').textContent = 'Elige una fecha.'; return; }
  const id = state.editingSchoolId;
  const datosBase = state.pendingSave;
  const anteriorData = state.schools[id];
  const existentes = getHorarios(anteriorData);
  // Si ya existe una versión guardada con exactamente esa misma fecha de
  // vigencia (en cualquier posición del historial, no solo la última), se
  // reemplaza esa versión en vez de agregar una nueva — evita que queden
  // varias versiones duplicadas con la misma fecha.
  const idxExistente = existentes.findIndex(h => h.vigenteDesde === fecha);
  let horarios;
  if (idxExistente !== -1) {
    horarios = existentes.slice(0, idxExistente).concat(existentes.slice(idxExistente + 1)).concat([{ vigenteDesde: fecha, bloques: state.formBloques }]);
  } else {
    horarios = existentes.concat([{ vigenteDesde: fecha, bloques: state.formBloques }]);
  }
  const data = { ...anteriorData, ...datosBase, horarios };
  state.schools[id] = data;
  try {
    await saveEscuelaConfig(id, data);
  } catch (err) {
    state.schools[id] = anteriorData;
    $('modal-vigencia-error').textContent = 'No se pudo guardar. Revisa tu conexión e intenta de nuevo.';
    return;
  }
  // El horario base cambió: si quedaron ediciones puntuales de fechas que
  // ahora coinciden exactamente con el nuevo horario, ya no tiene sentido
  // mantenerlas aparte (fue justamente para esto que se cambió el horario).
  await limpiarEdicionesRedundantes(id, fecha);
  state.pendingSave = null;
  cerrarModalEscuela();
  render();
  showToast('Escuela guardada ✓');
}

// Tras guardar un nuevo horario base vigente desde `fecha`, revisa las
// ediciones puntuales guardadas (de los meses ya cargados) para esa escuela
// en fechas >= `fecha`: si el contenido de la edición ya coincide con lo que
// generaría el nuevo horario base, la edición quedó redundante y se borra
// (así deja de "tapar" el patrón habitual en el resumen).
function normalizarBloques(bloques) {
  return (bloques || []).map(b => ({ cancha: b.cancha, horaInicio: b.horaInicio, horaFin: b.horaFin, tarifaHora: Number(b.tarifaHora) }))
    .sort((a,b) => a.cancha.localeCompare(b.cancha) || a.horaInicio.localeCompare(b.horaInicio));
}

async function limpiarEdicionesRedundantes(schoolId, fecha) {
  const school = state.schools[schoolId];
  for (const mk of state.months) {
    if (mk < fecha.slice(0,7)) continue;
    const fact = state.fact[mk] && state.fact[mk][schoolId];
    if (!fact || !fact.ediciones) continue;
    for (const ds of Object.keys(fact.ediciones)) {
      if (ds < fecha) continue;
      const dow = new Date(ds + 'T00:00:00').getDay();
      const vigentes = resolveBloques(school, ds).filter(b => b.dia === dow);
      if (!vigentes.length) continue;
      const edited = fact.ediciones[ds];
      if (JSON.stringify(normalizarBloques(edited)) === JSON.stringify(normalizarBloques(vigentes))) {
        delete fact.ediciones[ds];
        try { await deleteEdicion(mk, schoolId, ds); } catch (err) { /* no crítico: se puede restablecer manualmente */ }
      }
    }
  }
}

async function eliminarEscuela() {
  if (!state.editingSchoolId) return;
  if (!confirm('¿Eliminar esta escuela? Se perderá su configuración (el historial de facturación ya guardado no se borra).')) return;
  const id = state.editingSchoolId;
  const anteriorData = state.schools[id];
  delete state.schools[id];
  cerrarModalEscuela();
  render();
  try {
    await deleteEscuelaConfig(id);
  } catch (err) {
    state.schools[id] = anteriorData;
    render();
    showErrorToast('No se pudo eliminar. Revisa tu conexión e intenta de nuevo.');
  }
}

// ── INIT ──────────────────────────────────────────────────────
async function initApp() {
  state.loadError = null;
  const hoy = new Date();
  const currentKey = monthKeyOf(hoy);
  const prevKey = monthKeyOf(shiftMonth(hoy, -1));
  state.months = [currentKey, prevKey];
  state.activeMonth = currentKey;

  state.schools = await loadConfig();
  const [factCurrent, factPrev] = await Promise.all([loadFact(currentKey), loadFact(prevKey)]);
  state.fact[currentKey] = factCurrent;
  state.fact[prevKey] = factPrev;

  render();
}

function reintentarCarga() { initApp(); }

if (sessionStorage.getItem('cdv_escuelas_unlocked') === '1') {
  $('pin-screen').style.display = 'none';
  $('app').style.display = 'block';
  initApp();
}
</script>
